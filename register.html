
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SkillSwap</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <header class="auth-header">
        <a href="index.html" class="auth-logo">
            <img src="images/skillswap-logo.png" alt="SkillSwap Logo">
            <span>SkillSwap</span>
        </a>

        <a href="login.html" class="auth-nav-link">
            Login
        </a>
    </header>

    <main class="auth-container">

        <section class="auth-card">

            <p class="auth-label">JOIN OUR COMMUNITY</p>

            <h1>Create Your <span>Account</span></h1>

            <p class="auth-description">
                Share what you know. Learn what you love.
            </p>

            <form id="registerForm">

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="you@example.com"
                    required
                >

                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter password again"
                    minlength="6"
                    required
                >

                <button type="submit" class="auth-submit">
                    Create Account
                </button>

                <p id="registerMessage" class="auth-message"
                   aria-live="polite"></p>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </section>

    </main>

    <script src="js/auth.js"></script>
</body>
</html>
